<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./styles/styles.css" >
    <link rel="icon" href="./images/favicon_logo.png" >

    <title>Contact Me!</title>

    <script src="scripts/contact.js" defer></script>
</head>
<body>
    <header>
        <h1>Contact Form</h1>
    </header>
    <main>
        <form id="contact-form" action="#" method="get"> 
            <fieldset id="contact-information">
                <label for="fname">First Name
                    <input type="text" id="fname" name="fname" placeholder="John">
                </label>

                <label for="lname">Last Name
                    <input type="text" id="lname" name="lname" placeholder="Doe">
                </label>

                <label for="title">Job Title
                    <input type="text" id="title" name="title">
                </label>

                <label for="company">Company
                    <input type="text" id="company" name="company" placeholder="Apple">
                </label>

                <label for="linkedin">Linkedin URL
                    <input type="url" id="linkedin" name="linkedin">
                </label>

                <label for="email">Email
                    <input type="email" id="email" name="email" placeholder="john.doe@mail.com">
                </label>

                <label for="meet">How did we meet?
                    <select id="meet" name="meet">
                        <option value="none">-- Select an Option --</option>
                        <option value="event">At an Event</option>
                        <option value="school">At College</option>
                        <option value="work">At Work</option>
                        <option value="other">Other</option>
                    </select>
                </label>

                <label for="select-other">Other (please specify)
                    <input type="text" id="select-other" name="select-other" />
                </label>

                <label for="message">Message
                    <textarea id="message" name="message" rows="7"></textarea>
                </label>
            </fieldset>
            <fieldset id="messaging-options">
                <label for="messaging-list">
                    <input type="checkbox" name="messaging-list" id="messaging-list" />
                    Please add me to your messaging list 
                </label>

                <p><strong>Choose an email format:</strong>
                    <label for="format-html">
                        <input type="radio" name="format" id="format-html" />
                        <strong>HTML</strong>
                    </label>
                    <label for="format-text">
                        <input type="radio" name="format" id="format-text" />
                        <strong>Text</strong>
                    </label>
                </p>
            </fieldset>
            <button type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
