<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./styles/styles.css" >
    <link rel="icon" href="./images/favicon_logo.png" >

    <title>Contact Me!</title>

    <script src="scripts/contact.js" defer></script>
</head>
<body>
    <header>
        <h1>Contact Form</h1>
    </header>
    <main>
        <form id="contact-form" action="#" method="get"> 
            <label for="fname">First Name</label>
            <input type="text" id="fname" name="fname" placeholder="John">

            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lname" placeholder="Doe">

            <label for="title">Job Title</label>
            <input type="text" id="title" name="title">

            <label for="company">Company</label>
            <input type="text" id="company" name="company" placeholder="Apple">

            <label for="linkedin">Linkedin URL</label>
            <input type="url" id="linkedin" name="linkedin">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="john.doe@mail.com">
        </form>
    </main>
</body>
</html>
